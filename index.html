<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Autel Türkiye Tech. Support Panel</title>
<meta name="robots" content="noindex,nofollow">
<style>
  :root{color-scheme:dark}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:#16211D;color:#E8EFEA;padding:24px;
       font:15px/1.65 Barlow,system-ui,-apple-system,"Segoe UI",sans-serif}
  .k{max-width:440px}
  h1{font-size:19px;margin:0 0 10px;font-weight:600;letter-spacing:.01em}
  p{margin:0 0 10px;color:#9BAAA2}
  a{color:#E8EFEA;word-break:break-all}
  .nokta{display:inline-block;width:7px;height:7px;border-radius:50%;background:#7FB89B;
         margin-right:7px;animation:y 1.1s ease-in-out infinite}
  @keyframes y{0%,100%{opacity:.25}50%{opacity:1}}
  @media (prefers-reduced-motion:reduce){.nokta{animation:none;opacity:.7}}
</style>
</head>
<body>
<div class="k">
  <h1 id="baslik"><span class="nokta"></span>Panele bağlanılıyor</h1>
  <p id="aciklama">Güncel adres alınıyor.</p>
  <p id="elle"></p>
</div>
<script>
// Depo bilgisi adresin kendisinden okunur, elle duzenleme gerekmez.
//   https://KULLANICI.github.io/DEPO/  ->  KULLANICI / DEPO
const kullanici = location.hostname.split(".")[0];
const depo = location.pathname.split("/").filter(Boolean)[0] || (kullanici + ".github.io");
const KAYNAK = `https://raw.githubusercontent.com/${kullanici}/${depo}/main/adres.json`;

const $ = (x) => document.getElementById(x);

function kapali(sebep){
  $("baslik").textContent = "Panel şu anda kapalı";
  $("aciklama").textContent =
    "Panelin çalıştığı bilgisayar kapalı ya da henüz açılıyor olabilir. " +
    "Birkaç dakika sonra sayfayı yenileyin.";
  if (sebep) $("elle").textContent = sebep;
}

(async () => {
  try {
    // Onbellege takilmamak icin her seferinde farkli adres
    const r = await fetch(KAYNAK + "?t=" + Date.now(), { cache: "no-store" });
    if (!r.ok) return kapali("");
    const d = await r.json();
    if (!d || !d.url) return kapali("");

    $("aciklama").textContent = "Yönlendiriliyor…";
    $("elle").innerHTML = `Açılmazsa: <a href="${d.url}">${d.url}</a>`;
    location.replace(d.url);
  } catch (e) {
    kapali("");
  }
})();
</script>
</body>
</html>
