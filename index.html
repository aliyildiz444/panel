<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Autel Türkiye Teknik Destek</title>
<meta name="robots" content="noindex,nofollow">
<style>
  :root{color-scheme:dark}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:#0C322C;color:#E8EFEA;padding:24px;
       font:15px/1.6 Rubik,system-ui,-apple-system,"Segoe UI",sans-serif}
  .k{max-width:460px;width:100%}
  h1{font-size:19px;margin:0 0 10px;font-weight:600;letter-spacing:-.01em}
  p{margin:0 0 10px;color:#9EC3B7}
  a{color:#E8EFEA;word-break:break-all}
  .nokta{display:inline-block;width:7px;height:7px;border-radius:50%;background:#3FD1AC;
         margin-right:8px;animation:y 1.1s ease-in-out infinite}
  @keyframes y{0%,100%{opacity:.25}50%{opacity:1}}
  @media (prefers-reduced-motion:reduce){.nokta{animation:none;opacity:.8}}
  button{margin-top:6px;background:#11443B;color:#E8EFEA;border:1px solid #1C5A4D;
         font:inherit;font-size:14px;padding:9px 16px;border-radius:9px;cursor:pointer}
  button:hover{background:#17544A}
  .kucuk{font-size:12.5px;color:#6E8E83;margin-top:14px}
</style>
</head>
<body>
<div class="k">
  <h1 id="baslik"><span class="nokta"></span>Panele bağlanılıyor</h1>
  <p id="aciklama">Güncel adres alınıyor.</p>
  <p id="elle"></p>
  <button id="yenile" type="button" style="display:none">Yeniden dene</button>
  <p class="kucuk" id="damga"></p>
</div>
<script>
// Depo bilgisi adresin kendisinden okunur, elle duzenleme gerekmez.
//   https://KULLANICI.github.io/DEPO/  ->  KULLANICI / DEPO
const kullanici = location.hostname.split(".")[0];
const depo = location.pathname.split("/").filter(Boolean)[0] || (kullanici + ".github.io");

// Adres dosyasini UC ayri kaynaktan okuyoruz, cunku onbellekleri birbirinden
// bagimsiz. Ozellikle raw.githubusercontent dosyayi ~5 dakika onbellekte tutar
// ve sorgu parametresiyle atlatilamaz; o yuzden tek basina guvenilmez.
//   1) GitHub API  - onbellege takilmaz, en taze olan
//   2) Pages kopyasi - ayni depo, ayri dagitim
//   3) raw         - her zaman erisilebilir, ama bayat olabilir
// Hepsini birden sorup zaman damgasi en yeni olani kullaniyoruz.
const KAYNAKLAR = [
  { ad:"api",   url:`https://api.github.com/repos/${kullanici}/${depo}/contents/adres.json`, api:true },
  { ad:"pages", url:new URL("adres.json", location.href).href },
  { ad:"raw",   url:`https://raw.githubusercontent.com/${kullanici}/${depo}/main/adres.json` },
];

const $ = (x) => document.getElementById(x);

function kapali(){
  $("baslik").textContent = "Panel şu anda kapalı";
  $("aciklama").textContent =
    "Panelin çalıştığı bilgisayar kapalı ya da henüz açılıyor olabilir. " +
    "Birkaç dakika sonra yeniden deneyin.";
  $("elle").textContent = "";
  $("damga").textContent = "";
  $("yenile").style.display = "";
}

async function oku(k){
  try{
    const r = await fetch(k.url + (k.url.includes("?") ? "&" : "?") + "t=" + Date.now(),
                          { cache:"no-store", headers: k.api ? {Accept:"application/vnd.github.raw"} : {} });
    if(!r.ok) return null;
    let d = await r.json();
    // API ham icerik vermezse base64 doner, onu da cozelim
    if(d && d.content && d.encoding === "base64") d = JSON.parse(atob(d.content));
    return (d && d.url) ? d : null;
  }catch(e){ return null; }
}

async function git(){
  $("baslik").innerHTML = '<span class="nokta"></span>Panele bağlanılıyor';
  $("aciklama").textContent = "Güncel adres alınıyor.";
  $("yenile").style.display = "none";
  $("damga").textContent = "";

  const sonuclar = (await Promise.all(KAYNAKLAR.map(oku))).filter(Boolean);
  if(!sonuclar.length) return kapali();

  // En yeni zaman damgasi kazanir ("2026-10-14 13:00" formatinda duz karsilastirma yeterli)
  sonuclar.sort((a,b) => String(b.zaman || "").localeCompare(String(a.zaman || "")));
  const d = sonuclar[0];

  $("aciklama").textContent = "Yönlendiriliyor…";
  $("elle").innerHTML = `Açılmazsa: <a href="${d.url}">${d.url}</a>`;
  if(d.zaman) $("damga").textContent = "Adres " + d.zaman + " tarihinde güncellendi.";
  $("yenile").style.display = "";
  setTimeout(() => location.replace(d.url), 500);
}

$("yenile").onclick = git;
git();
</script>
</body>
</html>
